name: Deploy DSCP frontend to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "tsconfig*.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dscp-cloudflare-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://cipsazscgpyoaxwukmaw.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_w0DHSiTIu8MN4qaYkWm1-A_NtXHPhNe

      - name: Deploy to Cloudflare Worker dscp
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
