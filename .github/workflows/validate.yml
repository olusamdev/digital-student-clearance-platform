name: Validate student portal changes

on:
  push:
    branches:
      - main
      - feature/student-password-payment-flow
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock supabase/functions/student-portal/index.ts supabase/functions/student-payments/index.ts supabase/functions/manage-student-access/index.ts supabase/functions/manage-clearance/index.ts supabase/functions/manage-clearance-requirements/index.ts
